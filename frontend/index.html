<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Analytics</title>
  
  <!-- CSS Maestro Modular -->
  <link rel="stylesheet" href="./css/main.css">
  
  <!-- Chart.js para gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <main class="container">
    <header style="text-align: center; margin-bottom: 2rem;">
      <h1 style="color: var(--accent-color); font-size: 2.2rem; text-shadow: 0 0 15px var(--accent-glow);">GitHub Profile Analytics</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-top: 0.25rem;">FastAPI + ES6 Modules</p>
    </header>

    <section class="search-box">
      <input type="text" id="username-input" class="search-input" placeholder="Escribe un usuario de GitHub..." />
      <button id="search-btn" class="search-btn">Buscar</button>
    </section>

    <div id="status-message" class="status-box hidden" style="margin-top: 1.5rem;"></div>

    <div id="dashboard" class="hidden" style="margin-top: 1.5rem;">
      <article class="card">
        <div style="display: flex; gap: 1.25rem; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap;">
          <img id="avatar" src="" alt="Avatar" style="width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--accent-color); box-shadow: 0 0 15px var(--accent-glow);" />
          <div>
            <h2 id="name" style="font-size: 1.4rem; color: var(--text-main);"></h2>
            <a id="username" href="#" target="_blank" style="color: var(--accent-color); text-decoration: none; font-weight: 600;"></a>
            <p id="bio" style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem; line-height: 1.4;"></p>
          </div>
        </div>

        <div class="stats-grid">
          <div><span style="color: var(--text-muted); font-size: 0.85rem;">Repos</span><strong id="repos" style="display:block; font-size: 1.2rem; color: var(--accent-color); margin-top: 0.25rem;">0</strong></div>
          <div><span style="color: var(--text-muted); font-size: 0.85rem;">Seguidores</span><strong id="followers" style="display:block; font-size: 1.2rem; color: var(--accent-color); margin-top: 0.25rem;">0</strong></div>
          <div><span style="color: var(--text-muted); font-size: 0.85rem;">Siguiendo</span><strong id="following" style="display:block; font-size: 1.2rem; color: var(--accent-color); margin-top: 0.25rem;">0</strong></div>
        </div>
      </article>

      <div class="grid-two-cols">
        <article class="card">
          <h3 style="color: var(--accent-color); margin-bottom: 1rem; font-size: 1.1rem;">Lenguajes más usados</h3>
          <div style="position: relative; width: 100%; height: 260px;">
            <canvas id="languagesChart"></canvas>
          </div>
        </article>

        <article class="card">
          <h3 style="color: var(--accent-color); margin-bottom: 1rem; font-size: 1.1rem;">Top Repositorios</h3>
          <ul id="repos-list" style="list-style: none; padding: 0;"></ul>
        </article>
      </div>
    </div>
  </main>

  <!-- Módulo Principal JavaScript -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
